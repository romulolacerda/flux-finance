<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="w-full max-w-[480px] bg-white rounded-3xl shadow-2xl h-full max-h-[90dvh] flex flex-col animate-scale-in">
        <header class="flex-none flex items-center justify-between px-4 py-3 sm:px-6 sm:py-4 border-b border-slate-100 bg-white z-10 rounded-t-3xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-600">
                    <span class="material-symbols-outlined">event_note</span>
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">{{ editId ? 'Editar Lembrete' : 'Novo Lembrete' }}</h2>
            </div>
            <a routerLink="/app/reminders" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors cursor-pointer">
                <span class="material-symbols-outlined">close</span>
            </a>
        </header>

        <div class="flex-1 overflow-y-auto overscroll-contain min-h-0">
            <form [formGroup]="form" (ngSubmit)="submit()" class="p-4 sm:p-6 space-y-4 sm:space-y-6">
                <!-- Nome -->
                <div class="flex flex-col gap-1.5 relative w-full group">
                    <label class="text-sm font-bold text-slate-700 ml-1">Nome da Conta</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-4 text-slate-400">edit</span>
                        <input type="text" formControlName="name" placeholder="Ex: Aluguel, Luz" class="w-full h-14 bg-slate-50 border-2 border-slate-100 rounded-2xl pl-12 pr-4 text-base font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                </div>

                <!-- Grelha Dia/Recorrência -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5 relative w-full group">
                        <label class="text-sm font-bold text-slate-700 ml-1">Dia do Vencimento</label>
                        <div class="relative flex items-center">
                            <span class="material-symbols-outlined absolute left-4 text-slate-400">today</span>
                            <input type="number" min="1" max="31" formControlName="due_day" placeholder="1 a 31" class="w-full h-14 bg-slate-50 border-2 border-slate-100 rounded-2xl pl-12 pr-4 text-base font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary-500 focus:bg-white transition-all">
                        </div>
                    </div>

                    <div class="flex flex-col gap-1.5 relative w-full group">
                        <label class="text-sm font-bold text-slate-700 ml-1">Recorrência</label>
                        <div class="relative flex items-center">
                            <span class="material-symbols-outlined absolute left-4 text-slate-400">autorenew</span>
                            <select formControlName="recurrence_type" class="w-full h-14 bg-slate-50 border-2 border-slate-100 rounded-2xl pl-12 pr-4 text-base font-semibold text-slate-900 focus:outline-none focus:border-primary-500 focus:bg-white transition-all appearance-none cursor-pointer">
                                <option value="mensal">Mensal</option>
                                <option value="anual">Anual</option>
                            </select>
                            <span class="material-symbols-outlined absolute right-4 text-slate-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>
                </div>

                <!-- Data Limite -->
                <div class="flex flex-col gap-1.5 relative w-full group">
                    <label class="text-sm font-bold text-slate-700 ml-1">Data Final de Cobrança <span class="font-normal text-slate-400">(Opcional)</span></label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-4 text-slate-400">event_busy</span>
                        <input type="date" formControlName="end_date" class="w-full h-14 bg-slate-50 border-2 border-slate-100 rounded-2xl pl-12 pr-4 text-base font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                </div>
                
                <!-- Valor Estimado -->
                <div class="flex flex-col gap-1.5 relative w-full group">
                    <label class="text-sm font-bold text-slate-700 ml-1">Valor Estimado <span class="font-normal text-slate-400">(Opcional)</span></label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 font-bold text-slate-400">R$</span>
                        <input type="number" step="0.01" formControlName="amount" placeholder="0.00" class="w-full h-14 bg-slate-50 border-2 border-slate-100 rounded-2xl pl-12 pr-4 text-base font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                </div>

            </form>
        </div>

        <div class="flex-none w-full px-4 sm:px-6 pt-4 pb-6 border-t border-slate-100 bg-white z-10 rounded-b-3xl space-y-3">
            <button (click)="submit()" [disabled]="form.invalid || saving" class="w-full flex items-center justify-center gap-2 bg-primary-600 disabled:opacity-50 hover:bg-primary-700 text-white font-bold text-lg py-3.5 rounded-xl shadow-lg shadow-primary-600/30 transition-all active:scale-[0.98]">
                <span>{{ saving ? 'Salvando...' : 'Salvar Lembrete' }}</span>
                <span class="material-symbols-outlined">check</span>
            </button>

            @if (editId) {
            <button type="button" (click)="deleteReminder()" [disabled]="saving" class="w-full flex items-center justify-center gap-2 bg-white border-2 border-red-100 text-red-500 hover:bg-red-50 hover:border-red-200 font-bold text-base py-3 rounded-xl transition-all active:scale-[0.98]">
                <span>Excluir Lembrete</span>
                <span class="material-symbols-outlined text-lg">delete</span>
            </button>
            }
        </div>
    </div>
</div>
